version: "3.8"

services:
  app:
    build: .
    environment:
      - DATABASE_URL=postgres://root:password@db:5432/myapp?sslmode=disable
    ports:
      - "8989:8989"
    depends_on:
      - db

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: myapp
    ports:
      - "5432:5432"
